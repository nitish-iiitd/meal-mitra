<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MealMitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Hanken+Grotesk:wght@400..800&display=swap" rel="stylesheet" />
<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="mm-body">
  <div class="mm-app">
    <!-- Sidebar (desktop) -->
    <aside class="mm-sidebar">
      <div class="mm-brand">
        <div class="mm-brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16"/><path d="M4 8a8 8 0 0 0 16 0"/><path d="M12 20v-4"/><path d="M8 20h8"/></svg>
        </div>
        <div>
          <div class="mm-brand-name">MealMitra</div>
          <div class="mm-brand-sub">FAMILY KITCHEN</div>
        </div>
      </div>
      <nav class="mm-nav" id="mm-sidebar-nav"></nav>
      <div class="mm-sidebar-foot" id="mm-sidebar-foot"></div>
    </aside>

    <!-- Main column -->
    <div class="mm-main">
      <header class="mm-topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="mm-brand-mark" style="width:34px;height:34px;border-radius:11px">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16"/><path d="M4 8a8 8 0 0 0 16 0"/><path d="M12 20v-4"/><path d="M8 20h8"/></svg>
          </div>
          <div class="mm-brand-name" style="font-size:18px">MealMitra</div>
        </div>
        <div id="mm-topbar-avatar" style="width:40px;height:40px;border-radius:50%;background:var(--cream-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;color:var(--terra)">A</div>
      </header>
      <main class="mm-content"><div id="mm-screen"></div></main>
    </div>

    <!-- Bottom nav (mobile) -->
    <nav class="mm-bottomnav" id="mm-bottomnav"></nav>
  </div>

  <!-- Shared modal -->
  <div class="modal" id="mm-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content mm-modal">
        <div class="modal-header">
          <h5 class="modal-title">Title</h5>
          <button type="button" class="mm-modal-close" data-bs-dismiss="modal" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- Toast layer -->
  <div class="mm-toast-wrap" id="mm-toast"></div>

  <!-- jQuery + Bootstrap bundle -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App -->
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
